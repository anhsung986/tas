<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thư Mục 0/0/</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh; display: flex; justify-content: center;
            align-items: center; color: #ffffff; padding: 20px;
        }
        .dashboard {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px;
            width: 100%; max-width: 950px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 35px; flex-wrap: wrap; gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 20px;
        }
        .header-left h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .header-left p { font-size: 1rem; font-weight: 400; color: rgba(255, 255, 255, 0.7); }
        
        .admin-btn {
            background: rgba(147, 51, 234, 0.3); border: 1px solid rgba(147, 51, 234, 0.5);
            padding: 10px 20px; border-radius: 14px; color: #fff; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
            font-size: 0.9rem; text-decoration: none;
        }
        .admin-btn:hover {
            background: rgba(147, 51, 234, 0.5); transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(147, 51, 234, 0.4);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        
        .card {
            background: rgba(255, 255, 255, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px; padding: 30px 20px; text-align: center; text-decoration: none;
            color: #ffffff; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column; align-items: center; 
            position: relative; overflow: hidden; cursor: pointer;
        }
        .card:hover {
            transform: translateY(-8px); 
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5); 
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255,255,255,0.1);
        }
        .icon { font-size: 3.5rem; margin-bottom: 15px; transition: transform 0.3s ease; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .card:hover .icon { transform: scale(1.15); }
        
        .title { 
            font-size: 1.2rem; 
            font-weight: 700; 
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            word-break: break-all;
        }
        
        #loading { text-align: center; font-size: 1.2rem; width: 100%; grid-column: 1 / -1; color: rgba(255,255,255,0.8); }
        .error { color: #ff6b6b; text-align: center; width: 100%; grid-column: 1 / -1; }

        /* Giao diện khung Embed Loading & Modal Admin */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: rgba(20, 30, 48, 0.9); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 400px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00f2fe;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal p { font-size: 1.2rem; font-weight: 600; letter-spacing: 1px; color: #e0f2fe; margin-bottom: 20px; }
        
        .modal input {
            width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; margin-bottom: 15px; outline: none;
        }
        .modal input:focus { border-color: #00f2fe; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button {
            flex: 1; padding: 10px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-confirm { background: #00f2fe; color: #0f2027; }
        .btn-confirm:hover { background: #38bdf8; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div class="header-left">
                <h1>Quản Lý Thư Mục 0/0/</h1>
                <p>Tự động quét và liệt kê các file trong thư mục <strong>0/0/</strong></p>
            </div>
            <button onclick="openAdminModal()" class="admin-btn">
                🔒 Trang Random (Admin)
            </button>
        </div>
        <div class="grid" id="file-grid">
            <div id="loading">⏳ Đang quét thư mục 0/0/...</div>
        </div>
    </div>

    <!-- Khung Embed thông báo chờ chuyển hướng -->
    <div id="overlay" class="overlay">
        <div class="modal">
            <div class="spinner"></div>
            <p>[ Đang kiểm tra thông tin... ]</p>
        </div>
    </div>

    <!-- Modal Mật Khẩu Admin -->
    <div id="adminModal" class="overlay">
        <div class="modal" style="text-align: left;">
            <p style="text-align: center;">🔐 Xác Thực Quản Trị Viên</p>
            <input type="password" id="adminPass" placeholder="Nhập mật khẩu admin..." onkeydown="if(event.key==='Enter')verifyAdmin()">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeAdminModal()">Hủy</button>
                <button class="btn-confirm" onclick="verifyAdmin()">Truy cập</button>
            </div>
        </div>
    </div>

    <script>
        // Cấu hình GitHub Repository của bạn (có thể thay đổi tên repo nếu cần)
        const githubUsername = 'anhsung986'; 
        const repoName = 'canhan'; // Tên repo chứa thư mục 0/0
        const folderPath = '0/0'; 

        const apiURL = `https://api.github.com/repos/${githubUsername}/${repoName}/contents/${folderPath}`;

        async function fetchGitHubFiles() {
            const grid = document.getElementById('file-grid');
            
            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error('Thư mục "0/0" chưa tồn tại hoặc rỗng trên GitHub');
                
                const files = await response.json();
                grid.innerHTML = ''; 
                
                if(!Array.isArray(files) || files.length === 0) {
                    grid.innerHTML = '<div style="text-align:center; width:100%; color:rgba(255,255,255,0.7);">Thư mục 0/0 hiện đang trống.</div>';
                    return;
                }
                
                files.forEach(file => {
                    let icon = '📄'; 
                    const fileNameLower = file.name.toLowerCase();
                    
                    if (file.type === 'dir') icon = '📁';
                    else if(fileNameLower.endsWith('.jpg') || fileNameLower.endsWith('.png') || fileNameLower.endsWith('.gif')) icon = '🖼️';
                    else if(fileNameLower.endsWith('.pdf')) icon = '📕';
                    else if(fileNameLower.endsWith('.xlsx') || fileNameLower.endsWith('.csv')) icon = '📊';
                    else if(fileNameLower.endsWith('.mp4')) icon = '🎬';
                    else if(fileNameLower.endsWith('.html')) icon = '🌐';
                    
                    // Hiển thị tên file viết hoa gọn gàng
                    const displayName = file.name.toUpperCase();
                    
                    const card = `
                        <a onclick="handleFileClick('${file.name}')" class="card">
                            <span class="icon">${icon}</span>
                            <span class="title">${displayName}</span>
                        </a>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                grid.innerHTML = `<div class="error">Lỗi: ${error.message}.</div>`;
            }
        }

        // Hàm xử lý khi bấm vào thẻ file trong 0/0/
        function handleFileClick(fileName) {
            const overlay = document.getElementById('overlay');
            const targetUrl = `0/0/${fileName}`;
            
            overlay.classList.add('active');
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1200); 
        }

        // Quản lý Modal Admin
        function openAdminModal() {
            document.getElementById('adminModal').classList.add('active');
            document.getElementById('adminPass').value = '';
            document.getElementById('adminPass').focus();
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
        }

        function verifyAdmin() {
            const pass = document.getElementById('adminPass').value;
            // Mật khẩu mặc định là "admin123" (bạn có thể thay đổi tùy ý bên dưới)
            if (pass === 'admin123') {
                const overlay = document.getElementById('overlay');
                document.getElementById('adminModal').classList.remove('active');
                overlay.classList.add('active');
                setTimeout(() => {
                    window.location.href = 'random.html';
                }, 1000);
            } else {
                alert('Mật khẩu không chính xác!');
                document.getElementById('adminPass').value = '';
                document.getElementById('adminPass').focus();
            }
        }

        fetchGitHubFiles();
    </script>
</body>
</html>
